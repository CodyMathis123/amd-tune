name: Build and verify

on:
  push:
    branches: [Production]
  pull_request:
    branches: [Production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: .NET safety + simulation tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AmdTune.slnx
      - name: Build with warnings as errors
        run: dotnet build AmdTune.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/AmdTune.Tests/AmdTune.Tests.csproj -c Release --no-build --logger "trx;LogFileName=safety-tests.trx"
      - name: End-to-end simulation HTTP smoke test
        shell: pwsh
        run: ./scripts/smoke-simulation.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/AmdTune.Tests/TestResults
          if-no-files-found: ignore

  publish-smoke:
    name: Windows app publish
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish local UI
        run: dotnet publish src/AmdTune.Web/AmdTune.Web.csproj -c Release -r win-x64 --self-contained false -o artifacts/web
      - name: Publish independent recovery guard
        run: dotnet publish src/AmdTune.Recovery/AmdTune.Recovery.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/recovery
      - name: Assert standalone recovery executable starts without managed sidecars
        shell: pwsh
        run: |
          $recoveryCheck = (Resolve-Path "artifacts/recovery/AmdTune.Recovery.exe").Path
          & $recoveryCheck --self-check
          if ($LASTEXITCODE -ne 0) { throw "Recovery runtime self-check failed." }
          if (Test-Path "artifacts/recovery/AmdTune.Recovery.dll") {
            throw "Expected a single-file independent recovery executable."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-dev-build
          path: |
            artifacts/web
            artifacts/recovery
          retention-days: 7

  native-build:
    name: Official ADLX 2.0 bridge compilation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch AMD SDK source (under AMD license)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/ADLX.git third_party/ADLX
          git -C third_party/ADLX fetch --depth 1 origin 32b5a740d42295c5dfe9026b9f52683da0f3af91
          git -C third_party/ADLX checkout --detach 32b5a740d42295c5dfe9026b9f52683da0f3af91
      - name: Build bridge in normal PowerShell (auto-detect MSVC)
        shell: pwsh
        run: ./scripts/build-native.ps1 -AdlxSdkDirectory third_party/ADLX
      - uses: actions/upload-artifact@v4
        with:
          name: amd-adlx-bridge-unsigned-dev
          path: artifacts/native/AmdTune.AdlxBridge.exe
          retention-days: 7

  package-dev:
    name: Assemble unsigned Windows development bundle
    runs-on: windows-latest
    needs: [tests, publish-smoke, native-build]
    timeout-minutes: 10
    steps:
      - name: Download managed application and recovery outputs
        uses: actions/download-artifact@v4
        with:
          name: unsigned-windows-dev-build
          path: downloaded/managed
      - name: Download native ADLX bridge built from pinned official SDK
        uses: actions/download-artifact@v4
        with:
          name: amd-adlx-bridge-unsigned-dev
          path: downloaded/native
      - name: Assemble complete package and inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "downloaded/managed/web"
          $recovery = "downloaded/managed/recovery/AmdTune.Recovery.exe"
          $bridge = "downloaded/native/AmdTune.AdlxBridge.exe"
          foreach ($path in @($app, $recovery, $bridge)) {
            if (!(Test-Path $path)) { throw "Expected CI output missing: $path" }
          }
          New-Item -ItemType Directory -Force -Path "artifacts/bundle" | Out-Null
          Copy-Item -Path (Join-Path $app '*') -Destination "artifacts/bundle" -Force -Recurse
          Copy-Item -Path $recovery -Destination "artifacts/bundle/AmdTune.Recovery.exe" -Force
          $recoveryCheck = (Resolve-Path "artifacts/bundle/AmdTune.Recovery.exe").Path
          & $recoveryCheck --self-check
          if ($LASTEXITCODE -ne 0) { throw "Bundled independent recovery executable cannot run." }
          Copy-Item -Path $bridge -Destination "artifacts/bundle/AmdTune.AdlxBridge.exe" -Force
          foreach ($file in @("AmdTune.Web.exe", "AmdTune.Web.dll", "AmdTune.Recovery.exe", "AmdTune.AdlxBridge.exe")) {
            if (!(Test-Path (Join-Path "artifacts/bundle" $file))) { throw "Incomplete bundle, missing $file" }
          }
          @(
            "AMD Tune UNSIGNED DEVELOPMENT BUILD"
            "Source workflow commit: $env:GITHUB_SHA"
            "Native AMD ADLX SDK revision: 32b5a740d42295c5dfe9026b9f52683da0f3af91"
            "This artifact is NOT code-signed, hardware-validated or an official release."
            "It is intended for read-only ADLX discovery and simulated testing first."
            "Copy all extracted files together; do not separate the bridge and recovery executables."
            "Default launch: AmdTune.Web.exe (simulation only)."
            "Read-only launch: AmdTune.Web.exe --hardware (requires supported AMD driver)."
            "DO NOT enable hardware writes before the documented validation gates."
          ) | Set-Content -Encoding utf8 "artifacts/bundle/DEVELOPMENT-BUILD.txt"
          $hashLines = Get-ChildItem "artifacts/bundle" -File -Filter '*.exe' |
            Sort-Object Name |
            ForEach-Object { $h = Get-FileHash $_.FullName -Algorithm SHA256; "$($h.Hash)  $($_.Name)" }
          $hashLines | Set-Content -Encoding utf8 "artifacts/bundle/SHA256SUMS.txt"
      - name: Smoke-test published bundle from unrelated working directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = (Resolve-Path "artifacts/bundle/AmdTune.Web.exe").Path
          $probeRoot = Join-Path $env:RUNNER_TEMP "amd-tune-external-cwd"
          New-Item -ItemType Directory -Force -Path $probeRoot | Out-Null
          $process = Start-Process -FilePath $app -WorkingDirectory $probeRoot -PassThru
          try {
            $base = "http://127.0.0.1:5783"
            $info = $null
            for ($i = 0; $i -lt 40; $i++) {
              try { $info = Invoke-RestMethod "$base/api/info"; break }
              catch { Start-Sleep -Milliseconds 300 }
            }
            if ($null -eq $info) { throw "Published app did not serve /api/info." }
            if ($info.mode -ne "simulation") { throw "Safety regression: published app is not simulated by default." }
            foreach ($resource in @("/", "/index.html", "/app.js", "/styles.css")) {
              $response = Invoke-WebRequest -Uri "$base$resource" -UseBasicParsing
              if ($response.StatusCode -ne 200 -or !$response.Content) {
                throw "Published static asset $resource is not served correctly."
              }
              Write-Host "PASS $resource : HTTP 200"
            }
            if (!(Test-Path "artifacts/bundle/wwwroot/index.html")) {
              throw "Published bundle missing wwwroot/index.html"
            }
            Write-Host "PASS: published bundle serves UI and API from unrelated working directory."
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Verify guard process can acknowledge and disarm a diagnostic-only lease
        shell: pwsh
        run: ./scripts/smoke-recovery.ps1 -AppDirectory artifacts/bundle
      - name: Publish complete unsigned development package
        uses: actions/upload-artifact@v4
        with:
          name: amd-tune-windows-x64-unsigned-dev
          path: artifacts/bundle/
          retention-days: 7
          if-no-files-found: error
