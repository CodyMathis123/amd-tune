name: Build and verify

on:
  push:
    branches: [Production]
  pull_request:
    branches: [Production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: .NET safety + simulation tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AmdTune.slnx
      - name: Build with warnings as errors
        run: dotnet build AmdTune.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/AmdTune.Tests/AmdTune.Tests.csproj -c Release --no-build --logger "trx;LogFileName=safety-tests.trx"
      - name: End-to-end simulation HTTP smoke test
        shell: pwsh
        run: ./scripts/smoke-simulation.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/AmdTune.Tests/TestResults
          if-no-files-found: ignore

  publish-smoke:
    name: Windows app publish
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish local UI
        run: dotnet publish src/AmdTune.Web/AmdTune.Web.csproj -c Release -r win-x64 --self-contained false -o artifacts/web
      - name: Publish independent recovery guard
        run: dotnet publish src/AmdTune.Recovery/AmdTune.Recovery.csproj -c Release -r win-x64 --self-contained false -o artifacts/recovery
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-dev-build
          path: |
            artifacts/web
            artifacts/recovery
          retention-days: 7

  native-build:
    name: Official ADLX 2.0 bridge compilation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch AMD SDK source (under AMD license)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/ADLX.git third_party/ADLX
          git -C third_party/ADLX checkout --detach 32b5a740d42295c5dfe9026b9f52683da0f3af91
      - name: Build native adapter with MSVC
        shell: cmd
        run: |
          for /f "delims=" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do set "VS_INSTALL=%%i"
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64
          pwsh -NoProfile -File scripts/build-native.ps1 -AdlxSdkDirectory third_party/ADLX
      - uses: actions/upload-artifact@v4
        with:
          name: amd-adlx-bridge-unsigned-dev
          path: artifacts/native/AmdTune.AdlxBridge.exe
          retention-days: 7
